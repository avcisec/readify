services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: readify
      POSTGRES_PASSWORD: readify
      POSTGRES_USER: readify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readify -d readify"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:${READIFY_POSTGRES_PORT:-55431}:5432"
    volumes:
      - readify-postgres:/var/lib/postgresql

  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: readify_test
      POSTGRES_PASSWORD: readify
      POSTGRES_USER: readify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readify -d readify_test"]
      interval: 1s
      timeout: 2s
      retries: 30
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql

volumes:
  readify-postgres:
