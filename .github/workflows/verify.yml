name: Verify

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**/*.png"
      - "docs/**/*.jpg"
      - "docs/**/*.jpeg"
      - "feedback-sc/**"
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**/*.png"
      - "docs/**/*.jpg"
      - "docs/**/*.jpeg"
      - "feedback-sc/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-pdf.txt
      - name: Install PDF worker runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-fra
          python -m pip install --requirement scripts/requirements-pdf.txt
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: make verify
      - name: Smoke-test native PDF and selective OCR
        run: make pdf-runtime-smoke
      - name: Build web and worker
        run: pnpm build
