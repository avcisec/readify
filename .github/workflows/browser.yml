name: Browser

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/contracts/**"
      - "packages/modules/**"
      - "packages/platform/**"
      - "tests/e2e/**"
      - "docs/product/fixtures/**"
      - "scripts/start_e2e.sh"
      - "compose.yaml"
      - "playwright.config.ts"
      - "Makefile"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/browser.yml"
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/contracts/**"
      - "packages/modules/**"
      - "packages/platform/**"
      - "tests/e2e/**"
      - "docs/product/fixtures/**"
      - "scripts/start_e2e.sh"
      - "compose.yaml"
      - "playwright.config.ts"
      - "Makefile"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/browser.yml"

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser acceptance
        run: make e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
